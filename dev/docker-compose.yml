name: jellyfin-client-dev

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    ports:
      - '8096:8096'
    volumes:
      - ./data/jellyfin:/config
      - ./data/media:/media:ro

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    ports:
      - '5055:5055'
    volumes:
      - ./data/seerr:/app/config
    depends_on:
      - jellyfin

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    environment:
      PUID: '1000'
      PGID: '1000'
    ports:
      - '8989:8989'
    volumes:
      - ./data/sonarr:/config
      - ./data/media:/media
